<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>steam-controller-x</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #16181d;
      --panel: #1e2129;
      --border: #2c313c;
      --text: #e6e8ec;
      --dim: #8b93a3;
      --accent: #5b8cff;
      --on: #4ade80;
      --off: #333844;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    header {
      padding: 12px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    header h1 {
      font-size: 16px;
      margin: 0;
      font-weight: 600;
    }

    #status {
      font-size: 12px;
      color: var(--dim);
    }

    #status.connected {
      color: var(--on);
    }

    main {
      display: grid;
      grid-template-columns: 1fr 380px;
      gap: 16px;
      padding: 16px;
      max-width: 1200px;
      margin: 0 auto;
    }

    @media (max-width: 900px) {
      main {
        grid-template-columns: 1fr;
      }
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
    }

    .panel h2 {
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--dim);
      margin: 0 0 12px;
    }

    .row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }

    .row label {
      flex: 0 0 110px;
      color: var(--dim);
      font-size: 12px;
    }

    .row input[type=range] {
      flex: 1;
    }

    .row select {
      flex: 1;
      background: var(--off);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 4px 6px;
    }

    .value {
      width: 42px;
      text-align: right;
      font-variant-numeric: tabular-nums;
      color: var(--dim);
      font-size: 12px;
    }

    .pad-diagram {
      display: flex;
      flex-wrap: wrap;
      gap: 24px;
      justify-content: center;
      margin-bottom: 16px;
    }

    .stick-box {
      text-align: center;
    }

    .stick-box .label {
      font-size: 11px;
      color: var(--dim);
      margin-top: 4px;
    }

    svg.stick {
      background: #0f1116;
      border-radius: 50%;
    }

    .dot {
      fill: var(--accent);
    }

    .buttons-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(64px, 1fr));
      gap: 6px;
      margin-bottom: 16px;
    }

    .btn-light {
      padding: 6px 4px;
      text-align: center;
      border-radius: 6px;
      background: var(--off);
      color: var(--dim);
      font-size: 11px;
      border: 1px solid var(--border);
      transition: background 0.05s, color 0.05s;
    }

    .btn-light.on {
      background: var(--on);
      color: #05130a;
      border-color: var(--on);
    }

    .bars {
      display: flex;
      gap: 20px;
      margin-bottom: 16px;
    }

    .bar-box {
      flex: 1;
    }

    .bar-box .label {
      font-size: 11px;
      color: var(--dim);
      margin-bottom: 4px;
    }

    .bar-track {
      height: 14px;
      background: #0f1116;
      border-radius: 7px;
      overflow: hidden;
      border: 1px solid var(--border);
    }

    .bar-fill {
      height: 100%;
      background: var(--accent);
      width: 0%;
    }

    .imu-readout {
      font-size: 11px;
      color: var(--dim);
      font-variant-numeric: tabular-nums;
      white-space: pre;
    }

    .remap-list {
      max-height: 320px;
      overflow-y: auto;
    }

    .remap-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
    }

    .remap-row .name {
      flex: 0 0 150px;
      font-size: 12px;
    }

    .remap-row select {
      flex: 1;
    }

    .profile-controls {
      display: flex;
      gap: 6px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }

    button {
      background: var(--off);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px 10px;
      cursor: pointer;
      font-size: 12px;
    }

    button:hover {
      border-color: var(--accent);
    }

    button.primary {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    select#profile-select {
      flex: 1;
      min-width: 120px;
    }

    .rumble-row {
      display: flex;
      gap: 6px;
    }
  </style>
</head>

<body>
  <header>
    <h1>steam-controller-x</h1>
    <span id="status">connecting…</span>
  </header>
  <main>
    <section class="panel" id="monitor">
      <h2>Live Input</h2>

      <div class="pad-diagram">
        <div class="stick-box">
          <svg class="stick" width="110" height="110" viewBox="-110 -110 220 220">
            <circle r="100" fill="none" stroke="#2c313c" stroke-width="2" />
            <circle id="dot-left_stick" class="dot" r="8" cx="0" cy="0" />
          </svg>
          <div class="label">Left Thumbstick</div>
        </div>
        <div class="stick-box">
          <svg class="stick" width="110" height="110" viewBox="-110 -110 220 220">
            <circle r="100" fill="none" stroke="#2c313c" stroke-width="2" />
            <circle id="dot-right_stick" class="dot" r="8" cx="0" cy="0" />
          </svg>
          <div class="label">Right Thumbstick</div>
        </div>
        <div class="stick-box">
          <svg class="stick" width="110" height="110" viewBox="-110 -110 220 220">
            <circle r="100" fill="none" stroke="#2c313c" stroke-width="2" />
            <circle id="dot-left_pad" class="dot" r="6" cx="0" cy="0" />
          </svg>
          <div class="label">Left Pad</div>
        </div>
        <div class="stick-box">
          <svg class="stick" width="110" height="110" viewBox="-110 -110 220 220">
            <circle r="100" fill="none" stroke="#2c313c" stroke-width="2" />
            <circle id="dot-right_pad" class="dot" r="6" cx="0" cy="0" />
          </svg>
          <div class="label">Right Pad</div>
        </div>
      </div>

      <div class="bars">
        <div class="bar-box">
          <div class="label">Left Trigger</div>
          <div class="bar-track">
            <div class="bar-fill" id="bar-left_trigger"></div>
          </div>
        </div>
        <div class="bar-box">
          <div class="label">Right Trigger</div>
          <div class="bar-track">
            <div class="bar-fill" id="bar-right_trigger"></div>
          </div>
        </div>
        <div class="bar-box">
          <div class="label">Grip</div>
          <div class="bar-track">
            <div class="bar-fill" id="bar-grip"></div>
          </div>
        </div>
      </div>

      <div class="buttons-grid" id="buttons-grid"></div>

      <h2>IMU (raw, unmapped)</h2>
      <div class="imu-readout" id="imu-readout">accel: -\ngyro: -</div>
    </section>

    <section class="panel" id="config">
      <h2>Profile</h2>
      <div class="profile-controls">
        <select id="profile-select"></select>
        <button id="btn-load">Load</button>
        <button id="btn-save" class="primary">Save</button>
        <button id="btn-save-as">Save As…</button>
        <button id="btn-delete">Delete</button>
      </div>

      <h2>Deadzone &amp; Curve</h2>
      <div id="axis-controls"></div>

      <h2>Button Remap</h2>
      <div class="remap-list" id="remap-list"></div>

      <h2>Rumble Test</h2>
      <div class="rumble-row">
        <button data-motor="a">Motor A</button>
        <button data-motor="b">Motor B</button>
        <button data-motor="c">Motor C</button>
        <button data-motor="d">Motor D</button>
      </div>
    </section>
  </main>

  <script>
    const AXES = ["left_stick", "right_stick", "left_trigger", "right_trigger"];
    let logicalButtons = [];
    let xinputButtons = [];
    let activeProfile = null;
    let saveTimer = null;

    async function api(path, options) {
      const res = await fetch(path, options);
      if (!res.ok) throw new Error(`${path}: ${res.status} ${await res.text()}`);
      const text = await res.text();
      return text ? JSON.parse(text) : null;
    }

    function stickToXY(axis, radius) {
      const x = (axis.x / 32767) * radius;
      const y = -(axis.y / 32767) * radius; // screen Y is inverted vs. up-positive
      return [x, y];
    }

    function renderLive(msg) {
      const raw = msg.raw;
      const mapped = msg.mapped;
      if (!raw) return;

      for (const key of ["left_stick", "right_stick", "left_pad", "right_pad"]) {
        const dot = document.getElementById(`dot-${key}`);
        const radius = key.endsWith("pad") ? 70 : 85;
        const [x, y] = stickToXY(raw[key], radius);
        dot.setAttribute("cx", x.toFixed(1));
        dot.setAttribute("cy", y.toFixed(1));
      }

      document.getElementById("bar-left_trigger").style.width = `${(raw.left_trigger / 32767 * 100).toFixed(0)}%`;
      document.getElementById("bar-right_trigger").style.width = `${(raw.right_trigger / 32767 * 100).toFixed(0)}%`;
      document.getElementById("bar-grip").style.width = `${Math.min(100, raw.grip / 1.6).toFixed(0)}%`;

      for (const name of logicalButtons) {
        const el = document.getElementById(`btn-${name}`);
        if (el) el.classList.toggle("on", !!raw.buttons[name]);
      }

      document.getElementById("imu-readout").textContent =
        `accel: [${raw.imu.accel.join(", ")}]\ngyro:  [${raw.imu.gyro.join(", ")}]`;

      void mapped; // mapped state currently only informs the config panel indirectly
    }

    function connectWs() {
      const proto = location.protocol === "https:" ? "wss:" : "ws:";
      const ws = new WebSocket(`${proto}//${location.host}/ws`);
      const status = document.getElementById("status");
      ws.onopen = () => { status.textContent = "connected"; status.classList.add("connected"); };
      ws.onclose = () => {
        status.textContent = "disconnected — retrying…";
        status.classList.remove("connected");
        setTimeout(connectWs, 1000);
      };
      ws.onerror = () => ws.close();
      ws.onmessage = (ev) => renderLive(JSON.parse(ev.data));
    }

    function buildButtonsGrid() {
      const grid = document.getElementById("buttons-grid");
      grid.innerHTML = "";
      for (const name of logicalButtons) {
        const div = document.createElement("div");
        div.className = "btn-light";
        div.id = `btn-${name}`;
        div.textContent = name.replaceAll("_", " ");
        grid.appendChild(div);
      }
    }

    function debounceSave() {
      clearTimeout(saveTimer);
      saveTimer = setTimeout(() => {
        api("/api/active-profile", {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(activeProfile),
        }).catch((e) => console.error(e));
      }, 150);
    }

    function buildAxisControls() {
      const container = document.getElementById("axis-controls");
      container.innerHTML = "";
      for (const axis of AXES) {
        const settings = activeProfile[axis];
        const label = axis.replaceAll("_", " ");

        const dzRow = document.createElement("div");
        dzRow.className = "row";
        dzRow.innerHTML = `<label>${label} DZ</label><input type="range" min="0" max="0.9" step="0.01" value="${settings.deadzone}"><span class="value"></span>`;
        const dzInput = dzRow.querySelector("input");
        const dzVal = dzRow.querySelector(".value");
        dzVal.textContent = settings.deadzone.toFixed(2);
        dzInput.addEventListener("input", () => {
          activeProfile[axis].deadzone = parseFloat(dzInput.value);
          dzVal.textContent = activeProfile[axis].deadzone.toFixed(2);
          debounceSave();
        });

        const curveRow = document.createElement("div");
        curveRow.className = "row";
        curveRow.innerHTML = `<label>${label} curve</label><input type="range" min="0.3" max="3" step="0.05" value="${settings.curve}"><span class="value"></span>`;
        const curveInput = curveRow.querySelector("input");
        const curveVal = curveRow.querySelector(".value");
        curveVal.textContent = settings.curve.toFixed(2);
        curveInput.addEventListener("input", () => {
          activeProfile[axis].curve = parseFloat(curveInput.value);
          curveVal.textContent = activeProfile[axis].curve.toFixed(2);
          debounceSave();
        });

        container.appendChild(dzRow);
        container.appendChild(curveRow);
      }
    }

    function buildRemapList() {
      const list = document.getElementById("remap-list");
      list.innerHTML = "";
      const bound = new Map(activeProfile.bindings.map((b) => [b.button, b.target]));
      for (const button of logicalButtons) {
        const row = document.createElement("div");
        row.className = "remap-row";
        const name = document.createElement("div");
        name.className = "name";
        name.textContent = button.replaceAll("_", " ");
        const select = document.createElement("select");
        const noneOpt = document.createElement("option");
        noneOpt.value = "";
        noneOpt.textContent = "(unmapped)";
        select.appendChild(noneOpt);
        for (const target of xinputButtons) {
          const opt = document.createElement("option");
          opt.value = target;
          opt.textContent = target.replaceAll("_", " ");
          select.appendChild(opt);
        }
        select.value = bound.get(button) ?? "";
        select.addEventListener("change", () => {
          activeProfile.bindings = activeProfile.bindings.filter((b) => b.button !== button);
          if (select.value) {
            activeProfile.bindings.push({ button, target: select.value });
          }
          debounceSave();
        });
        row.appendChild(name);
        row.appendChild(select);
        list.appendChild(row);
      }
    }

    async function refreshProfileSelect() {
      const names = await api("/api/profiles");
      const select = document.getElementById("profile-select");
      select.innerHTML = "";
      for (const name of names) {
        const opt = document.createElement("option");
        opt.value = name;
        opt.textContent = name;
        if (name === activeProfile.name) opt.selected = true;
        select.appendChild(opt);
      }
    }

    async function loadActiveProfile() {
      activeProfile = await api("/api/active-profile");
      buildAxisControls();
      buildRemapList();
      await refreshProfileSelect();
    }

    async function init() {
      logicalButtons = await api("/api/logical-buttons");
      xinputButtons = await api("/api/xinput-buttons");
      buildButtonsGrid();
      await loadActiveProfile();
      connectWs();

      document.getElementById("btn-save").addEventListener("click", () => {
        api("/api/active-profile/save", { method: "POST" }).then(refreshProfileSelect).catch((e) => alert(e));
      });
      document.getElementById("btn-save-as").addEventListener("click", async () => {
        const name = prompt("Profile name:", activeProfile.name);
        if (!name) return;
        activeProfile.name = name;
        await api("/api/active-profile", {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(activeProfile),
        });
        await api("/api/active-profile/save", { method: "POST" });
        await refreshProfileSelect();
      });
      document.getElementById("btn-load").addEventListener("click", async () => {
        const name = document.getElementById("profile-select").value;
        if (!name) return;
        await api(`/api/profiles/${encodeURIComponent(name)}/load`, { method: "POST" });
        await loadActiveProfile();
      });
      document.getElementById("btn-delete").addEventListener("click", async () => {
        const name = document.getElementById("profile-select").value;
        if (!name || !confirm(`Delete profile "${name}"?`)) return;
        await api(`/api/profiles/${encodeURIComponent(name)}`, { method: "DELETE" });
        await refreshProfileSelect();
      });
      for (const btn of document.querySelectorAll(".rumble-row button")) {
        btn.addEventListener("click", () => {
          api(`/api/rumble/${btn.dataset.motor}`, { method: "POST" }).catch((e) => alert(e));
        });
      }
    }

    init().catch((e) => {
      console.error(e);
      document.getElementById("status").textContent = `init failed: ${e.message}`;
    });
  </script>
</body>

</html>
